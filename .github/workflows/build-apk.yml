name: Build Rider App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-rider-apk:
    name: "🛵 Build Rider App APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Android Native Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --no-install
          fi
          if [ -f "google-services.json" ]; then
            cp -f google-services.json android/app/google-services.json
          fi
          rm -f android/local.properties
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Release APK with Gradle
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Rename Rider APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/DabbaNation-Rider.apk

      - name: Upload Rider App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DabbaNation-Rider-APK
          path: android/app/build/outputs/apk/release/DabbaNation-Rider.apk
          retention-days: 30
