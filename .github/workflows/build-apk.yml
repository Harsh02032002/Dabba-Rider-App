name: Build Rider App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-rider-apk:
    name: "🛵 Build Rider App APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept Licenses
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH
          
          # Pre-accept official Android SDK licenses so Gradle never fails
          mkdir -p "$ANDROID_ROOT/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a532e303d79e8ff304328d85090\n" > "$ANDROID_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a532e303d79e8ff304328d85090\n" > "$ANDROID_ROOT/licenses/android-sdk-preview-license"
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" > "$ANDROID_ROOT/licenses/intel-android-extra-license"
          
          # Check and accept via sdkmanager binary if available
          for SM in "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$(which sdkmanager 2>/dev/null)"; do
            if [ -x "$SM" ]; then
              yes | "$SM" --licenses || true
              break
            fi
          done

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Android Native Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --no-install
          fi
          if [ -f "google-services.json" ]; then
            cp -f google-services.json android/app/google-services.json
          fi
          rm -f android/local.properties
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          # Grant executable permissions to Hermes compiler and binaries
          chmod -R +x node_modules/react-native/sdks/hermesc/ || true
          find node_modules/ -type f -name "hermesc*" -exec chmod +x {} + 2>/dev/null || true
          find node_modules/.bin -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Build Release APK with Gradle
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Prepare Rider APK for Download
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} apk-output/DabbaNation-Rider.apk \; || cp android/app/build/outputs/apk/release/app-release.apk apk-output/DabbaNation-Rider.apk

      - name: Upload Rider App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DabbaNation-Rider-APK
          path: apk-output/DabbaNation-Rider.apk
          retention-days: 30
