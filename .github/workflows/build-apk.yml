name: Build Rider App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-rider-apk:
    name: "🛵 Build Rider App APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
            yes | sdkmanager --licenses || true
          else
            ANDROID_SDK_ROOT="${RUNNER_TEMP}/android-sdk"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
            unzip -q /tmp/cmdline.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Android Native Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --no-install
          fi
          if [ -f "google-services.json" ]; then
            cp -f google-services.json android/app/google-services.json
          fi
          rm -f android/local.properties
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Release APK with Gradle
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Prepare Rider APK for Download
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} apk-output/DabbaNation-Rider.apk \; || cp android/app/build/outputs/apk/release/app-release.apk apk-output/DabbaNation-Rider.apk

      - name: Upload Rider App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DabbaNation-Rider-APK
          path: apk-output/DabbaNation-Rider.apk
          retention-days: 30
